# =========================================================
# application-test.yml — Spring Boot TEST profile
# Loaded when @ActiveProfiles("test") is used in test classes.
# Uses the same local MySQL database as development.
# =========================================================

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/skillpilot?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: "2005"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: false
    locations: classpath:db/migration

skillpilot:
  jwt:
    secret: "test-jwt-secret-for-testing-only-do-not-use-in-production-minimum-32-chars"
    expiration-ms: 86400000
  cors:
    allowed-origin: http://localhost:3000

gemini:
  api-key: "test-key-not-used"
  model: gemini-flash-latest
  enabled: false
  timeout-ms: 15000
  temperature: 0.1
  max-output-tokens: 1000
