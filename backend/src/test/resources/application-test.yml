# =========================================================
# application-test.yml — Spring Boot TEST profile
# Loaded when @ActiveProfiles("test") is used in test classes.
# Uses isolated in-memory H2 database to protect dev MySQL.
# =========================================================

spring:
  datasource:
    url: jdbc:h2:mem:skillpilot_test;DB_CLOSE_DELAY=-1;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration

skillpilot:
  jwt:
    secret: "test-jwt-secret-for-testing-only-do-not-use-in-production-minimum-32-chars"
    expiration-ms: 86400000
  cors:
    allowed-origin: http://localhost:3000

gemini:
  api-key: "test-key-not-used"
  model: gemini-flash-latest
  enabled: false
  timeout-ms: 15000
  temperature: 0.1
  max-output-tokens: 1000
